<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rey Miga</title>
        <link rel="stylesheet" href="css/style_reyMiga.css">
    </head>
    <body>
        <header>
            <h1>ReyMiga</h1>
        </header>
        <div class="layout-principal">
            <main class="content">
                <h2>Nuestras variedades</h2>
                <div class="contenedor">
                    <div class="caja">Migas</div>
                    <div class="caja">Pebetes</div>
                    <div class="caja">Baguettes</div>
                    <div class="caja">Arabes</div>
                    <div class="caja">Pizzas y Pizzetas</div>
                </div>
                <h3>Un poco sobre nosotros...</h2>
                <p>Somos una pequeña empresa familiar dedicada a la elaboración de sangüches fríos 
                para comercios, eventos y particulares.</p>
            </main>
        </div>
        <h3>¿Alguna duda?¡contactanos!</h3>
        <form id="form" method="POST">
            <input type="text" name="nombre" placeholder="Tu nombre" required>
            <input type="email" name="email" placeholder="Tu correo" required>
            <textarea name="mensaje" placeholder="Mensaje" rows="4" required></textarea>
            <button type="submit" id="btn-submit">Enviar</button>
        </form>
        <footer class="footer"><p>2026 Sanguchería Rey Miga</p></footer>
    </body>
</html>
